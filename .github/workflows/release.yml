name: Release app and package

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and tag
        shell: bash
        run: |
          version="$(cat VERSION)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "${GITHUB_REF_NAME}" == "v${version}" ]]
          test -f "docs/releases/v${version}.md"
      - name: Test
        run: |
          swift test
          python3 Scripts/test-cli.py Samples/scale.mid
      - name: Build universal app
        run: |
          bash Scripts/build-app.sh
          file "build/FreeScore for Mac.app/Contents/MacOS/FreeScore"
          lipo "build/FreeScore for Mac.app/Contents/MacOS/FreeScore" -verify_arch arm64 x86_64
      - name: Package ZIP and checksum
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/FreeScore for Mac.app" dist/FreeScore-for-Mac.zip
          (cd dist && shasum -a 256 FreeScore-for-Mac.zip > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat VERSION)"
          if gh release view "v${version}" >/dev/null 2>&1; then
            gh release upload "v${version}" dist/FreeScore-for-Mac.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "v${version}" dist/FreeScore-for-Mac.zip dist/SHA256SUMS.txt \
              --title "FreeScore for Mac v${version}" \
              --notes-file "docs/releases/v${version}.md" \
              --latest
          fi
      - uses: oras-project/setup-oras@v2.0.2
      - name: Publish GitHub Packages artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(cat VERSION)"
          echo "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          oras push "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/freescore-for-mac:${version}" \
            --artifact-type application/vnd.freescore.macos.app.v1+zip \
            --annotation "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --annotation "org.opencontainers.image.version=${version}" \
            dist/FreeScore-for-Mac.zip:application/zip
